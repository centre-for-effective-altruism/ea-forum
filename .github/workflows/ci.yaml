name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
      - name: Run lint
        run: npm run lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
      - name: Run typecheck
        run: npm run typecheck
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup environment
        uses: ./.github/actions/setup-environment
      - name: Run tests
        run: npm run test
